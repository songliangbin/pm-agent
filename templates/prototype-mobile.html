  if (phone) results.push({ok:true,msg:'phone-frame 存在'});
  // 图标
  var emojiNav = document.querySelectorAll('.nav-tab-label');
  var hasEmoji = false;
  emojiNav.forEach(function(el) { if (/[\u{1F300}-\u{1F9FF}]/u.test(el.textContent)) hasEmoji = true; });
  results.push(hasEmoji ? {ok:false,msg:'导航含Emoji'} : {ok:true,msg:'导航无Emoji'});
  // 底部导航
  var tabbar = document.querySelector('.bottom-nav');
  if (tabbar) results.push({ok:true,msg:'底部导航存在'});
  // 响应式缩放
  if (typeof adjustScale === 'function') results.push({ok:true,msg:'adjustScale 存在'});
  // Toast
  if (typeof showToast === 'function') results.push({ok:true,msg:'Toast 存在'}); else results.push({ok:false,msg:'Toast 缺失'});
  // 按钮检查（统计无 onclick 的按钮）
  var deadBtns = 0;
  document.querySelectorAll('button, .btn').forEach(function(b) {
    if (!b.onclick && !b.getAttribute('onclick') && !b.closest('form')) deadBtns++;
  });
  if (deadBtns === 0) results.push({ok:true,msg:'所有按钮有响应'}); else results.push({ok:false,msg:'发现 '+deadBtns+' 个无响应按钮'});
  // 禁止"开发中"占位
  var devText = document.body.innerText.match(/开发中|建设中|暂未开放|即将上线/g);
  if (!devText) results.push({ok:true,msg:'无"开发中"占位'}); else results.push({ok:false,msg:'发现"开发中"占位文本'});
  // 状态栏图标
  var statusIcons = document.querySelector('.status-icons');
  results.push(statusIcons ? {ok:true, msg:'状态栏图标存在'} : {ok:false, msg:'状态栏图标缺失'});
  // 导航栏
  var topBar = document.getElementById('topBar');
  results.push(topBar ? {ok:true, msg:'顶部导航栏存在'} : {ok:false, msg:'顶部导航栏缺失'});
  // CSS变量
  var rootStyle = getComputedStyle(document.documentElement);
  var statusH = rootStyle.getPropertyValue('--status-h').trim();
  results.push(statusH ? {ok:true, msg:'status-h变量存在'} : {ok:false, msg:'status-h变量缺失'});
  var topbarH = rootStyle.getPropertyValue('--topbar-h').trim();
  results.push(topbarH ? {ok:true, msg:'topbar-h变量存在'} : {ok:false, msg:'topbar-h变量缺失'});
  // 输出
  console.log('%c=== PM Agent 质量自检 ===','font-size:14px;font-weight:bold');
  results.forEach(function(r) { console.log(r.ok?'%c\u2713 '+r.msg:'%c\u2717 '+r.msg, r.ok?'color:#10b981':'color:#ef4444'); });
  return results;
}

function runAssertions(){
  var A=[],pass=0,fail=0;
  function assert(name,ok,detail){
    if(ok){pass++;A.push({s:'✓',n:name})}
    else{fail++;A.push({s:'✗',n:name,d:detail||''})}
  }
  // DOM 结构
  assert('phone-frame',!!document.querySelector('.phone-frame'));
  assert('phone-screen',!!document.querySelector('.phone-screen'));
  assert('dynamic-island',!!document.querySelector('.dynamic-island'));
  assert('status-bar',!!document.querySelector('.status-bar'));
  assert('status-icons',!!document.querySelector('.status-icons'));
  assert('top-bar',!!document.getElementById('topBar'));
  assert('bottom-nav',!!document.getElementById('bottomNav'));
  assert('content',!!document.querySelector('.content'));
  assert('wechat-capsule',!!document.querySelector('.wechat-capsule'));
  assert('sub-page',!!document.querySelector('.sub-page'));
  // CSS 变量
  var rs=getComputedStyle(document.documentElement);
  var sh=rs.getPropertyValue('--status-h').trim();
  assert('--status-h',sh!==''&&sh!=='none','值='+sh);
  var th=rs.getPropertyValue('--topbar-h').trim();
  assert('--topbar-h',th!==''&&th!=='none','值='+th);
  var ps=rs.getPropertyValue('--phone-scale').trim();
  assert('--phone-scale',ps!==''&&ps!=='none','值='+ps);
  // 关键函数
  assert('adjustScale',typeof adjustScale==='function');
  assert('showToast',typeof showToast==='function');
  assert('selfCheck',typeof selfCheck==='function');
  assert('switchTab',typeof switchTab==='function');
  assert('openSubPage',typeof openSubPage==='function');
  assert('closeSubPage',typeof closeSubPage==='function');
  assert('goBack',typeof goBack==='function');
  assert('DataFactory',typeof DataFactory==='object');
  // 输出
  console.log('%c=== 自动化断言 '+(fail===0?'全部通过':'存在失败')+' ===','font-size:14px;font-weight:bold;color:'+(fail===0?'#10b981':'#ef4444'));
  console.log('通过:'+pass+' / 失败:'+fail+' / 总计:'+(pass+fail));
  A.forEach(function(r){console.log(r.s+' '+r.n+(r.d?' → '+r.d:''))});
  return{pass:pass,fail:fail,items:A};
}

// M41: 横向滚动区域鼠标拖拽（隐藏滚动条后用拖拽替代，桌面浏览器打开时可用鼠标左右拖动）
function initDragScroll(){
  document.querySelectorAll('.drag-scroll').forEach(function(el){
    var isDown=false, startX=0, scrollLeft=0, moved=false;
    el.addEventListener('mousedown',function(e){
      isDown=true; moved=false;
      startX = e.pageX - el.offsetLeft;
      scrollLeft = el.scrollLeft;
    });
    el.addEventListener('mouseleave',function(){ isDown=false; });
    el.addEventListener('mouseup',function(){ isDown=false; });
    el.addEventListener('mousemove',function(e){
      if(!isDown) return;
      e.preventDefault();
      var x = e.pageX - el.offsetLeft;
      var walk = x - startX;
      if(Math.abs(walk)>3) moved=true;
      el.scrollLeft = scrollLeft - walk;
    });
    // 防止拖拽后误触发 click
    el.addEventListener('click',function(e){
      if(moved){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  });
}

// Banner 轮播：自动播放 + 圆点指示器 + 手动滑动
function initBannerCarousel(){
  document.querySelectorAll('.banner-track').forEach(function(track){
    var slides = track.querySelectorAll('.home-banner');
    if (slides.length < 2) return;
    var dotsWrap = track.querySelector('.banner-dots');
    var idx = 0, timer = null;
    function go(i){
      idx = (i + slides.length) % slides.length;
      slides.forEach(function(s, k){ s.classList.toggle('active', k === idx); });
      if (dotsWrap) dotsWrap.querySelectorAll('.banner-dot').forEach(function(d, k){ d.classList.toggle('active', k === idx); });
    }
    if (!dotsWrap){
      dotsWrap = document.createElement('div');
      dotsWrap.className = 'banner-dots';
      slides.forEach(function(_, k){
        var d = document.createElement('span');
        d.className = 'banner-dot' + (k===0 ? ' active' : '');
        d.onclick = function(){ go(k); restart(); };
        dotsWrap.appendChild(d);
      });
      track.appendChild(dotsWrap);
    }
    function restart(){ clearInterval(timer); timer = setInterval(function(){ go(idx+1); }, 3500); }
    var startX = 0;
    track.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; clearInterval(timer); }, {passive:true});
    track.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
      restart();
    }, {passive:true});
    go(0); restart();
  });
}

// 营销区倒计时（[data-countdown] 存结束时间戳）
function initCountdown(){
  document.querySelectorAll('[data-countdown]').forEach(function(el){
    var end = parseInt(el.getAttribute('data-countdown'), 10) || (Date.now() + 3600000);
    var boxes = el.querySelectorAll('.promo-timer-box');
    function tick(){
      var diff = Math.max(0, end - Date.now());
      var h = Math.floor(diff / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      var pad = function(n){ return (n < 10 ? '0' : '') + n; };
      if (boxes.length >= 3){
        boxes[0].textContent = pad(h); boxes[1].textContent = pad(m); boxes[2].textContent = pad(s);
      }
      if (diff <= 0) clearInterval(timer);
    }
    var timer = setInterval(tick, 1000);
    tick();
  });
}
